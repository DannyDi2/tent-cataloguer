[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tent-cataloguer"
version = "1.1.0"
description = "Tent Cataloguer for Linux - offline catalog of external and local disks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyQt6"]

[project.scripts]
tent-cataloguer = "dcat_gui:main"

[tool.setuptools]
py-modules = ["dcat_core", "dcat_gui", "icons"]
