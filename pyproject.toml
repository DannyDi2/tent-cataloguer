[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tent-cataloguer"
version = "2.0.8"
description = "Tent Cataloguer for Linux - offline catalog of external and local disks"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Danny" }]
license = { text = "GPL-3.0" }
dependencies = ["PyQt6"]

[project.optional-dependencies]
media = ["mutagen", "Pillow"]

[project.urls]
Homepage = "https://github.com/DannyDi2/tent-cataloguer"

[project.scripts]
tent-cataloguer = "dcat_gui:main"

[tool.setuptools]
py-modules = ["dcat_core", "dcat_gui", "icons"]
